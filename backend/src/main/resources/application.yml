server:
  port: 5001

spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: user-service

  config:
    import: "optional:file:./.env[.properties]"
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/UserDB}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    show-sql: false

  mvc:
    log-request-details: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    supported-submit-methods: []
    validator-url: ""
    persist-authorization: false

app:
  security:
    user-access:
      issuer: urn:library:user-service
      audience: library-api
      active-key-id: user-access-v1
      private-key-location: ${USER_ACCESS_PRIVATE_KEY_LOCATION:file:./.secrets/user-access-private.pem}
      public-keys:
        user-access-v1: ${USER_ACCESS_PUBLIC_KEY_LOCATION:file:./.secrets/user-access-public.pem}

# Chi tiết lỗi constraint từ PostgreSQL có thể chứa giá trị hash.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
