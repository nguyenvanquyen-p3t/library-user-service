server:
  port: 5001

spring:
  application:
    name: user-service

  config:
    import: "optional:file:./.env[.properties]"
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/UserDB}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration