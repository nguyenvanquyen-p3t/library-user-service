  /api/v1/internal/oauth2/introspect:
    post:
      tags:
      - Nội bộ
      operationId: introspectUserAccessToken
      summary: Gateway kiểm tra user access token và phiên (RFC 7662)
      description: 'THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI. Gateway gửi Service JWT trong Authorization, user access
        token trong form token. Kiểm tra danh tính/quyền Gateway trước token người dùng. Chỉ user access token được
        introspect; refresh/registration/Service JWT trong token trả active false. JWT đúng chữ ký/issuer/audience/thời
        hạn, user ACTIVE, phiên đúng user/còn hiệu lực mới active true. Phiên hết hạn/thu hồi làm active false dù
        JWT còn hạn. Roles lấy từ database; không cache active response. Lỗi hạ tầng/xác thực Gateway không trở
        thành inactive. PENDING DECISION Q11a: bên phát/cấu hình Service JWT Gateway, không suy ra từ user RS256/Q14.
        Kết nối triển khai yêu cầu TLS.'
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/sessions.md#introspect
      x-required-service-permission: tokens:introspect
      security:
      - ServiceJwt: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
            example:
              token: example-user-access-token
              token_type_hint: access_token
      responses:
        '200':
          description: Token người dùng active hoặc inactive; không có envelope/messageCode.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntrospectionActiveResponse'
                - $ref: '#/components/schemas/IntrospectionInactiveResponse'
              examples:
                active:
                  value:
                    active: true
                    sub: '3'
                    token_type: Bearer
                    iss: urn:library:user-service
                    aud:
                    - library-api
                    exp: 1792403000
                    iat: 1792399400
                    sid: 2e8b95c4-1326-49d2-86f3-9a409eb70067
                    roles:
                    - READER
                inactive:
                  value:
                    active: false
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
        '400':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionInvalidRequest'
              examples:
                invalid_request:
                  value:
                    error: invalid_request
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
        '405':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionInvalidRequest'
              examples:
                invalid_request:
                  value:
                    error: invalid_request
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
            Allow:
              required: true
              schema:
                type: string
                enum:
                - POST
        '415':
          description: invalid_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionInvalidRequest'
              examples:
                invalid_request:
                  value:
                    error: invalid_request
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
        '500':
          description: server_error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionServerError'
              examples:
                server_error:
                  value:
                    error: server_error
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
        '503':
          description: temporarily_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionUnavailable'
              examples:
                temporarily_unavailable:
                  value:
                    error: temporarily_unavailable
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
        '401':
          description: 'Thiếu xác thực: {} và Bearer; token sai: invalid_token; thiếu quyền: insufficient_scope.
            Cả ba đều 401, không dùng 403/envelope.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntrospectionMissingAuthentication'
                - $ref: '#/components/schemas/IntrospectionAuthenticationError'
              examples:
                missing:
                  value: {}
                invalid:
                  value:
                    error: invalid_token
                denied:
                  value:
                    error: insufficient_scope
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
              description: Mọi response introspection không được cache.
            WWW-Authenticate:
              required: true
              schema:
                type: string
                enum:
                - Bearer
                - Bearer error="invalid_token"
                - Bearer error="insufficient_scope"
              description: Giá trị tương ứng lần lượt với {}, invalid_token và insufficient_scope.
components:
  securitySchemes:
    UserAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT RS256, TTL 3600 giây; iss urn:library:user-service, aud [library-api], kid user-access-v1;
        sub/sid. User ACTIVE và phiên hợp lệ. Đây là mô tả hợp đồng, chưa có bộ xác thực JWT runtime.
    ServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Service JWT độc lập trong Authorization. Borrow users:read; Admin users:read/users:status:write;
        Gateway tokens:introspect. PENDING DECISION Q03/Q11a: thuật toán, issuer/audience/subject, TTL, claim quyền,
        khóa; không tự áp user RS256/Q14.'
    AdminAccessToken:
      type: apiKey
      in: header
      name: X-Admin-Access-Token
      description: User access token của actor Admin, dùng đồng thời ServiceJwt (AND). Xác minh token/phiên, user
        ACTIVE và role ADMIN hiện tại từ database; không nhận actorId/role do client tự khai.
