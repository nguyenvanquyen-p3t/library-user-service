# Đặc tả thiết kế; xem docs/api/openapi.md trước khi cập nhật.
openapi: 3.0.3
info:
  title: Library User Service
  version: 0.1.0-design
  description: Hợp đồng 20 operation; login/refresh/logout UC02–UC04 và GET/PATCH hồ sơ UC06 đã triển khai, 15 operation khác còn DESIGN_ONLY. Swagger UI chỉ dùng đọc tài liệu,
    tắt Try it out. 19 operation dùng envelope success/messageCode/message/data; introspection dùng form và JSON
    riêng theo RFC 7662. Refresh token trong JSON cho Web/Android. Cấu hình Service JWT Q03/Q11a PENDING DECISION;
    không suy ra thuật toán/issuer/audience/khóa Service JWT từ user access token. Quyết định và ranh giới transaction
    duy trì trong docs/confirmed-decisions.md và docs/requirements.md. Không có API quản lý role.
servers:
- url: /
  description: Cùng origin với tài liệu; login/refresh/logout UC02–UC04 và GET/PATCH hồ sơ UC06 đã triển khai, 15 operation khác còn DESIGN_ONLY.
tags:
- name: Đăng ký Local
- name: Xác thực
- name: Mật khẩu
- name: Google
- name: Hồ sơ
- name: Phiên
- name: Nội bộ
paths:
  /api/v1/auth/register/request-code:
    post:
      tags:
      - Đăng ký Local
      operationId: requestRegistrationCode
      summary: Xin OTP đăng ký
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Kiểm tra username/email chưa được sử dụng, cấp OTP REGISTER trước khi có user. Chưa lưu password/dữ liệu đăng ký tạm. OTP gắn email/purpose, không gắn username; xem OTP REGISTER.

        commit hash OTP mới và vô hiệu mã cũ trước khi gửi SMTP đồng bộ. SMTP lỗi/timeout trả 503 SERVICE_UNAVAILABLE; lần cấp mã vẫn tính giới hạn, không phục hồi mã cũ hoặc tự cấp mã retry. Chi tiết tại Q06.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#register-request-code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCodeRequest'
            example:
              userName: reader01
              email: reader@example.com
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRegistrationCodeResponse'
              examples:
                REGISTER_CODE_SENT:
                  value:
                    success: true
                    messageCode: REGISTER_CODE_SENT
                    message: Mã xác minh đã được gửi đến email
                    data:
                      expiresIn: 600
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/RequestRegistrationCodeError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/OtpRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/register:
    post:
      tags:
      - Đăng ký Local
      operationId: registerLocalUser
      summary: Hoàn tất đăng ký Local
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Xác minh OTP trước khi tạo user ACTIVE, hash password, gán READER và dùng mã một lần cùng transaction. Không cấp token hoặc tạo phiên; đăng nhập riêng. Xem vòng đời tài khoản và OTP/mật khẩu.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              userName: reader01
              email: reader@example.com
              password: Abc@123456
              fullName: Nguyen Van A
              phoneNumber: 0901234567
              verificationCode: '583921'
      responses:
        '201':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLocalUserResponse'
              examples:
                REGISTER_SUCCESS:
                  value:
                    success: true
                    messageCode: REGISTER_SUCCESS
                    message: Đăng ký tài khoản thành công
                    data:
                      id: 3
                      userName: reader01
                      email: reader@example.com
                      fullName: Nguyen Van A
                      phoneNumber: 0901234567
                      status: ACTIVE
                      roles:
                      - READER
                      hasPassword: true
                      linkedProviders: []
        '400':
          $ref: '#/components/responses/RegisterLocalUserError400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/RequestRegistrationCodeError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      tags:
      - Xác thực
      operationId: login
      summary: Đăng nhập Local
      description: |-
        ĐÃ TRIỂN KHAI UC02 — 2026-11-10.

        User ACTIVE có password đúng mới được đăng nhập. Argon2id; giữ khóa user đến commit,
        tạo session 30 ngày và refresh token opaque 7 ngày, lưu hash SHA-256. JWT RS256 chứa sub/sid,
        không chứa roles, typ at+jwt, TTL 3600 giây; xác minh dung sai 30 giây, hạn phiên không dung sai.
        Chỉ trả token sau commit; metadata thiết bị null. Google và UC09 vẫn chưa triển khai.
      x-implementation-status: IMPLEMENTED
      x-design-source: docs/api/current-contract.md#login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              identifier: reader@example.com
              password: Abc@123456
      responses:
        '200':
          description: Login thành công sau commit; không cache cặp token.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                LOGIN_SUCCESS:
                  value:
                    success: true
                    messageCode: LOGIN_SUCCESS
                    message: Đăng nhập thành công
                    data:
                      accessToken: eyJhbGciOi...
                      refreshToken: d8K3mP7q...
                      tokenType: Bearer
                      expiresIn: 3600
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '401':
          $ref: '#/components/responses/LoginError401'
        '403':
          $ref: '#/components/responses/LoginError403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/LoginError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/refresh:
    post:
      tags:
      - Xác thực
      operationId: refreshTokens
      summary: Rotation refresh token
      description: |-
        ĐÃ TRIỂN KHAI ngày 2026-11-11. Token → user → phiên: token hết hạn/thu hồi trả REFRESH_TOKEN_INVALID trước ACCOUNT_BANNED và SESSION_INACTIVE. Khóa user rồi đọc lại token/phiên; rotation trong transaction READ_COMMITTED, trả token sau commit. Giữ sid, TTL access 3600 giây/refresh 604800 giây; không gia hạn phiên hoặc LastSeenAt. Reuse không thu hồi phiên/token thay thế. Mọi response, gồm lỗi, có Cache-Control no-store.
      x-implementation-status: IMPLEMENTED
      x-design-source: docs/api/current-contract.md#refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: d8K3mP7q...
      responses:
        '200':
          description: Thành công; dữ liệu ví dụ chỉ minh họa.
          headers:
            Cache-Control:
              description: Không lưu response vào cache; áp dụng cả response lỗi.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokensResponse'
              examples:
                TOKEN_REFRESH_SUCCESS:
                  value:
                    success: true
                    messageCode: TOKEN_REFRESH_SUCCESS
                    message: Làm mới token thành công
                    data:
                      accessToken: new-access-token...
                      refreshToken: new-refresh-token...
                      tokenType: Bearer
                      expiresIn: 3600
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '401':
          $ref: '#/components/responses/RefreshTokensError401'
        '403':
          $ref: '#/components/responses/LoginError403'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      tags:
      - Xác thực
      operationId: logout
      summary: Đăng xuất phiên hiện tại bằng refresh token
      description: |-
        ĐÃ TRIỂN KHAI ngày 2026-11-11. Token cũ/hết hạn/đã rotation còn bản ghi vẫn xác định đúng phiên để logout; không yêu cầu user ACTIVE hoặc access token. Khóa user, thu hồi phiên với LOGOUT và refresh token còn hiệu lực trong transaction READ_COMMITTED. Phiên đã kết thúc/token không tìm thấy trả kết quả chung, không ghi đè lịch sử; lỗi database/commit trả lỗi. Mọi response, gồm lỗi, có Cache-Control no-store.
      x-implementation-status: IMPLEMENTED
      x-design-source: docs/api/current-contract.md#logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: d8K3mP7q...
      responses:
        '200':
          description: Thành công; dữ liệu ví dụ chỉ minh họa.
          headers:
            Cache-Control:
              description: Không lưu response vào cache; áp dụng cả response lỗi.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                LOGOUT_SUCCESS:
                  value:
                    success: true
                    messageCode: LOGOUT_SUCCESS
                    message: Đăng xuất thành công
                    data: null
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/forgot-password/request-code:
    post:
      tags:
      - Mật khẩu
      operationId: requestPasswordResetCode
      summary: Xin OTP quên mật khẩu
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Cấp OTP PASSWORD_RESET, email không tồn tại nhận thông báo chung. Chưa có password thì Google và UC09. Xem OTP/mật khẩu và UC05.

        gửi SMTP đồng bộ sau commit OTP. Bước gửi SMTP lỗi/timeout vẫn trả 200 PASSWORD_RESET_CODE_SENT với kết quả chung, ghi lỗi vận hành nội bộ; không che lỗi database thành thành công. Lần cấp mã đã commit vẫn tính giới hạn gửi, không tự cấp lại. Chi tiết tại Q06.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#forgot-password-request-code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordCodeRequest'
            example:
              email: reader@example.com
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPasswordResetCodeResponse'
              examples:
                PASSWORD_RESET_CODE_SENT:
                  value:
                    success: true
                    messageCode: PASSWORD_RESET_CODE_SENT
                    message: Nếu email tồn tại trong hệ thống, mã xác minh sẽ được gửi
                    data:
                      expiresIn: 600
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/LoginError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/OtpRateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Mật khẩu
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng OTP
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Theo Q13 chốt ngày 2026-10-25, gửi email, OTP, mật khẩu mới và xác nhận trong cùng request hoàn tất; server xác minh OTP và kiểm tra mật khẩu trước khi lưu, không có API xác minh riêng hoặc ticket. Cập nhật PasswordHash, dùng mã một lần và thu hồi mọi phiên/refresh token cùng transaction; không mở khóa BANNED. Chưa có password thì Google/UC09. Xem UC05.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#reset-password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: reader@example.com
              verificationCode: '628351'
              newPassword: New@123456
              confirmPassword: New@123456
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
              examples:
                PASSWORD_RESET_SUCCESS:
                  value:
                    success: true
                    messageCode: PASSWORD_RESET_SUCCESS
                    message: Đặt lại mật khẩu thành công
                    data: null
        '400':
          $ref: '#/components/responses/RegisterLocalUserError400'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/LoginError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me:
    get:
      tags:
      - Hồ sơ
      operationId: getMyProfile
      summary: Xem hồ sơ của mình
      description: |-
        ĐÃ TRIỂN KHAI UC06 — 2026-11-12.

        Chỉ trả hồ sơ người gọi, không nhận userId tùy ý, không trả hash/secret. Chỉ xem không thay đổi hồ sơ. Xem UC06.
      x-implementation-status: IMPLEMENTED
      x-design-source: docs/api/current-contract.md#profile-get
      security:
      - UserAccessToken: []
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyProfileResponse'
              examples:
                PROFILE_GET_SUCCESS:
                  value:
                    success: true
                    messageCode: PROFILE_GET_SUCCESS
                    message: Lấy thông tin cá nhân thành công
                    data:
                      id: 3
                      userName: reader01
                      email: reader@example.com
                      fullName: Nguyen Van A
                      phoneNumber: 0901234567
                      status: ACTIVE
                      roles:
                      - READER
                      hasPassword: true
                      linkedProviders:
                      - GOOGLE
        '401':
          $ref: '#/components/responses/GetMyProfileError401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
      - Hồ sơ
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ của mình
      description: |-
        ĐÃ TRIỂN KHAI UC06 — 2026-11-12.

        Chỉ sửa fullName/phoneNumber của mình, không sửa roles/status/password/username/email. Theo PATCH đã chốt, bỏ qua trường để giữ nguyên; fullName không null/trắng, phoneNumber null để xóa, chuỗi rỗng bị từ chối; không nhận body rỗng hoặc trường ngoài danh sách. Trigger cập nhật Users.UpdatedAt khi dữ liệu thực sự đổi; xem schema.
        Transaction READ_COMMITTED khóa user trước khi đọc lại user/phiên; mất hiệu lực sau khi chờ khóa trả 401 SESSION_INACTIVE, không lưu. Chỉ trả thành công sau commit.
      x-implementation-status: IMPLEMENTED
      x-design-source: docs/api/current-contract.md#profile-update
      security:
      - UserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
            example:
              fullName: Nguyen Van B
              phoneNumber: 0987654321
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMyProfileResponse'
              examples:
                PROFILE_UPDATE_SUCCESS:
                  value:
                    success: true
                    messageCode: PROFILE_UPDATE_SUCCESS
                    message: Cập nhật thông tin cá nhân thành công
                    data:
                      id: 3
                      userName: reader01
                      email: reader@example.com
                      fullName: Nguyen Van B
                      phoneNumber: 0987654321
                      status: ACTIVE
                      roles:
                      - READER
                      hasPassword: true
                      linkedProviders:
                      - GOOGLE
        '400':
          $ref: '#/components/responses/RequestRegistrationCodeError400'
        '401':
          $ref: '#/components/responses/GetMyProfileError401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/password:
    put:
      tags:
      - Mật khẩu
      operationId: changePassword
      summary: Đổi mật khẩu và thu hồi mọi phiên
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Đổi PasswordHash và thu hồi mọi phiên/refresh token, kể cả phiên gọi, cùng transaction. Giữ identity Google; client xóa token và đăng nhập lại. Chưa có password thì UC09. Xem UC07.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#password-change
      security:
      - UserAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: Abc@123456
              newPassword: New@123456
              confirmPassword: New@123456
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
              examples:
                PASSWORD_CHANGE_SUCCESS:
                  value:
                    success: true
                    messageCode: PASSWORD_CHANGE_SUCCESS
                    message: Đổi mật khẩu thành công. Vui lòng đăng nhập lại
                    data: null
        '400':
          $ref: '#/components/responses/ChangePasswordError400'
        '401':
          $ref: '#/components/responses/GetMyProfileError401'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/LoginError409'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/google:
    post:
      tags:
      - Google
      operationId: authenticateWithGoogle
      summary: Đăng nhập hoặc bắt đầu đăng ký Google
      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Ba nhánh: identity đã có thì đăng nhập; chưa có identity nhưng email Google đã xác minh trùng Local thì tự liên kết không hỏi mật khẩu Local; người mới nhận registrationToken 10 phút, chưa có phiên. Chỉ user ACTIVE được cấp session/token. Tự liên kết không tạo user hoặc đổi role/password. Xem Google và registrationToken.
      x-implementation-status: DESIGN_ONLY
      x-design-source: docs/api/current-contract.md#google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleRequest'
            example:
              idToken: eyJhbGciOiJSUzI1NiIs...
      responses:
        '200':
          description: Thành công theo thiết kế; message và dữ liệu ví dụ chỉ minh họa.
          content:
