      description: |-
        THIẾT KẾ ĐÃ XÁC NHẬN — CHƯA TRIỂN KHAI.

        Chỉ ACTIVE/BANNED. Khóa ghi status và thu hồi mọi phiên/refresh token còn hiệu lực liên quan cùng transaction; mở khóa không phục hồi phiên/token. Introspection từ chối phiên thu hồi ở lần kiểm tra sau commit. Không thêm API kích hoạt/role. id là User ID kiểu Integer theo nguồn; xem vòng đời tài khoản.

        cùng trạng thái vẫn 200 USER_STATUS_UPDATE_SUCCESS, không ghi đè thời điểm/lý do thu hồi cũ. Lệnh cùng user khóa cùng bản ghi và xử lý tuần tự theo database. Cấm khóa đối tượng có ADMIN, kể cả tự khóa, trả 403 ACCESS_DENIED. Timeout cần Admin đọc lại để đối soát, không tự gửi lại lệnh cũ; audit theo Q10.

        PENDING DECISION Q03: cấu hình Service JWT (thuật toán, issuer/audience/subject, TTL, claim quyền và khóa). Không dùng cấu hình user token thay thế.

